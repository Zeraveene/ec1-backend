name = "epicon1-backend"
main = "src/index.ts"
account_id = "d458f7392f56bbf5e01154266a2f42b6"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "ec1mod.codezrv.com", custom_domain = true },
  { pattern = "ec1.gacogames.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production-preparation"
ALLOW_NEW_ACCOUNTS = "false"
LEGACY_MIGRATION_ENABLED = "false"
PLAYFAB_TITLE_ID = "3BFE7"
RECOVERY_ENABLED = "false"
IAP_PURCHASES_ENABLED = "false"
IAP_ALLOW_TEST_PURCHASES = "false"
MAIL_FROM = "noreply@gacogames.com"
PASSWORD_RESET_ORIGIN = "https://ec1.gacogames.com"

[triggers]
crons = ["0 * * * *"]

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@gacogames.com"]

[[d1_databases]]
binding = "DB"
database_name = "epicon1-player-data"
database_id = "cb40c675-a47a-478a-8094-674a55c7b4ac"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PLAYER_SAVES"
bucket_name = "epicon1-player-saves"
[[r2_buckets]]
binding = "AUDIT_BLOBS"
bucket_name = "epicon1-audit-blobs"
[[r2_buckets]]
binding = "LEGACY_ARCHIVE"
bucket_name = "epicon1-legacy-archive"

[env.staging]
name = "epicon1-backend-staging"
workers_dev = true
routes = []
[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
[env.staging.vars]
ENVIRONMENT = "staging"
ALLOW_NEW_ACCOUNTS = "true"
LEGACY_MIGRATION_ENABLED = "false"
RECOVERY_ENABLED = "false"
IAP_PURCHASES_ENABLED = "false"
IAP_ALLOW_TEST_PURCHASES = "false"
PLAYFAB_TITLE_ID = "3BFE7"
[env.staging.triggers]
crons = ["0 * * * *"]
[[env.staging.d1_databases]]
binding = "DB"
database_name = "epicon1-player-data-staging"
database_id = "c6a3ce96-ea84-4f31-8c6f-21fcbdb24313"
migrations_dir = "migrations"
[[env.staging.r2_buckets]]
binding = "PLAYER_SAVES"
bucket_name = "epicon1-player-saves-staging"
[[env.staging.r2_buckets]]
binding = "AUDIT_BLOBS"
bucket_name = "epicon1-audit-blobs-staging"
[[env.staging.r2_buckets]]
binding = "LEGACY_ARCHIVE"
bucket_name = "epicon1-legacy-archive-staging"
