name = "epicon1-backend"
main = "src/index.ts"
account_id = "d458f7392f56bbf5e01154266a2f42b6"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
routes = [
  { pattern = "ec1mod.codezrv.com", custom_domain = true },
  { pattern = "ec1.gacogames.com", custom_domain = true },
  { pattern = "ec2mod.codezrv.com/api/classic-admin/*", zone_name = "codezrv.com" },
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
STORY_TEST_ENABLED = "true"
STORY_TEST_PLAYERS = "26B502B30D4FE386"
STORY_TEST_COUPON = "EC1-STORY-RUN"
ENVIRONMENT = "production-preparation"
CLASSIC_ADMIN_ORIGIN = "https://ec2mod.codezrv.com"
# Existing EC1 PlayFab Web App public audience; native Android package/signing verified.
GOOGLE_CLIENT_IDS = "1078144059071-56j0to4phj699691rg0j87iuupd75e1k.apps.googleusercontent.com"
# Native Sign in with Apple ID-token audience; no web Services ID or private key required.
APPLE_CLIENT_IDS = "com.gacogames.epiccon"
# Dedicated confidential browser clients; private credentials use Worker secret bindings.
GOOGLE_BROWSER_CLIENT_ID = "1078144059071-3blfmsc8s3m7vh2g251hjfftkm6hdc9t.apps.googleusercontent.com"
GOOGLE_BROWSER_REDIRECT_URI = "https://ec1mod.codezrv.com/api/auth/browser/google/callback"
APPLE_BROWSER_CLIENT_ID = "com.gacogames.epiccon.auth"
APPLE_BROWSER_TEAM_ID = "32ST5862ML"
APPLE_BROWSER_KEY_ID = "6GN787AK68"
APPLE_BROWSER_REDIRECT_URI = "https://ec1mod.codezrv.com/api/auth/browser/apple/callback"
ALLOW_NEW_ACCOUNTS = "false"
LEGACY_MIGRATION_ENABLED = "true"
EC1_MANUAL_BACKUPS_ENABLED = "true"
PLAYFAB_TITLE_ID = "3BFE7"
RECOVERY_ENABLED = "false"
IAP_PURCHASES_ENABLED = "true"
IAP_ALLOW_TEST_PURCHASES = "false"
IAP_EDITOR_TEST_ENABLED = "true"
IAP_EDITOR_TEST_PLAYERS = "26B502B30D4FE386"
# Store verification keys/credentials are provisioned as Worker secret bindings.
# The public Google licensing key is also recorded in config/ec1-google-play-public-key.txt.
IAP_GOOGLE_PACKAGE_NAME = "com.gacogames.epiccon"
IAP_APPLE_BUNDLE_ID = "com.gacogames.epiccon"
IAP_APPLE_VERIFICATION_MODE = "receipt"
MAIL_FROM = "noreply@gacogames.com"
PASSWORD_RESET_ORIGIN = "https://ec1.gacogames.com"
DISCORD_ADMIN_REDIRECT_URI = "https://ec1mod.codezrv.com/auth/discord/callback"
DISCORD_GAME_CLIENT_ID = "1557970385440481310"
DISCORD_GAME_REDIRECT_URIS = "https://ec1mod.codezrv.com/api/auth/discord/callback,discord-1557970385440481310:/authorize/callback"

[[services]]
binding = "ADMIN_AUTHORITY"
service = "epicon2-moderation-tool"
entrypoint = "AdminAuthority"

[[services]]
binding = "EC2_ADMIN_SESSION"
service = "epicon2-moderation-tool"

[triggers]
crons = ["0 * * * *"]

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@gacogames.com"]

[[d1_databases]]
binding = "DB"
database_name = "epicon1-player-data"
database_id = "cb40c675-a47a-478a-8094-674a55c7b4ac"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PLAYER_SAVES"
bucket_name = "epicon1-player-saves"
[[r2_buckets]]
binding = "AUDIT_BLOBS"
bucket_name = "epicon1-audit-blobs"
[[r2_buckets]]
binding = "LEGACY_ARCHIVE"
bucket_name = "epicon1-legacy-archive"

[env.staging]
name = "epicon1-backend-staging"
workers_dev = true
preview_urls = false
routes = []
send_email = []
[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
[env.staging.vars]
ENVIRONMENT = "staging"
ALLOW_NEW_ACCOUNTS = "true"
LEGACY_MIGRATION_ENABLED = "false"
RECOVERY_ENABLED = "false"
IAP_PURCHASES_ENABLED = "false"
IAP_ALLOW_TEST_PURCHASES = "false"
IAP_EDITOR_TEST_ENABLED = "false"
IAP_EDITOR_TEST_PLAYERS = ""
IAP_GOOGLE_PACKAGE_NAME = "com.gacogames.epiccon"
IAP_APPLE_BUNDLE_ID = "com.gacogames.epiccon"
IAP_APPLE_VERIFICATION_MODE = "receipt"
PLAYFAB_TITLE_ID = "3BFE7"
MAIL_FROM = "noreply@gacogames.com"
PASSWORD_RESET_ORIGIN = "https://epicon1-backend-staging.johanesnindyo.workers.dev"
DISCORD_GAME_CLIENT_ID = "1557970385440481310"
DISCORD_GAME_REDIRECT_URIS = "https://epicon1-backend-staging.johanesnindyo.workers.dev/api/auth/discord/callback,http://127.0.0.1:18082/oauth/discord/callback,discord-1557970385440481310:/authorize/callback"
[env.staging.triggers]
crons = ["0 * * * *"]
[[env.staging.d1_databases]]
binding = "DB"
database_name = "epicon1-player-data-staging"
database_id = "c6a3ce96-ea84-4f31-8c6f-21fcbdb24313"
migrations_dir = "migrations"
[[env.staging.r2_buckets]]
binding = "PLAYER_SAVES"
bucket_name = "epicon1-player-saves-staging"
[[env.staging.r2_buckets]]
binding = "AUDIT_BLOBS"
bucket_name = "epicon1-audit-blobs-staging"
[[env.staging.r2_buckets]]
binding = "LEGACY_ARCHIVE"
bucket_name = "epicon1-legacy-archive-staging"
